<!DOCTYPE html>
<html>
<head>
  <title>Edit Product</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h3>Edit Product</h3>
    <div class="card p-3 shadow-sm">
      <form method="POST" class="row g-2">
        <div class="col-md-4"><input class="form-control" name="name" value="{{ p[1] }}" required></div>
        <div class="col-md-3"><input class="form-control" name="type" value="{{ p[2] }}"></div>
        <div class="col-md-3"><input class="form-control" name="company" value="{{ p[3] }}"></div>
        <div class="col-md-2"><input class="form-control" name="bag_size" value="{{ p[4] }}"></div>
        <div class="col-md-3"><input class="form-control" name="batch_no" value="{{ p[5] }}"></div>
        <div class="col-md-3"><input class="form-control" name="expiry" type="date" value="{{ p[6] }}"></div>
        <div class="col-md-2"><input class="form-control" name="purchase_price" value="{{ p[7] }}"></div>
        <div class="col-md-2"><input class="form-control" name="sale_price" value="{{ p[8] }}"></div>
        <div class="col-md-2"><input class="form-control" name="quantity" value="{{ p[9] }}"></div>
        <div class="col-md-2"><button class="btn btn-success w-100">Update</button></div>
      </form>
      <a href="/products" class="mt-3">Back</a>
    </div>
  </div>
</body>
</html>
