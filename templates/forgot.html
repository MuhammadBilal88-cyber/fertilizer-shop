<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center" style="height:100vh;">
    <div class="card p-4 shadow" style="width:350px;">
      <h4 class="text-success">Reset Password</h4>
      <form method="POST">
        <input class="form-control mb-2" name="code" placeholder="Master Code" required>
        <input class="form-control mb-3" name="new" type="password" placeholder="New Password" required>
        <button class="btn btn-success w-100">Reset</button>
      </form>
      <a href="/" class="mt-3">Back to Login</a>
    </div>
  </div>
</body>
</html>
