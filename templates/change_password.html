<!DOCTYPE html>
<html>
<head>
  <title>Change Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h3>Change Password</h3>
    <div class="card p-3 shadow-sm" style="max-width:400px;">
      <form method="POST">
        <input class="form-control mb-2" name="old" type="password" placeholder="Old Password" required>
        <input class="form-control mb-3" name="new" type="password" placeholder="New Password" required>
        <button class="btn btn-success w-100">Change</button>
      </form>
      <a href="/dashboard" class="mt-3">Back</a>
    </div>
  </div>
</body>
</html>
